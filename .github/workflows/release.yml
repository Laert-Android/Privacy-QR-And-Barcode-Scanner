name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or commit to build, e.g. v2.2 (empty = the branch you run this from)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Show exactly what is being built
        run: |
          git rev-parse HEAD
          git describe --tags --always
          grep -n "storeFile\|versionCode\|versionName\|vcsInfo\|isIncremental" app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Write keystore and keystore.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > qrscanner-new.jks
          {
            echo "storeFile=qrscanner-new.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          # Older build scripts resolve the keystore relative to app/ instead of the repo
          # root. Provide it in both places so any tagged version of the project signs.
          cp qrscanner-new.jks app/qrscanner-new.jks

      - name: Verify signing inputs (fails early with a clear message)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          pwd
          ls -la qrscanner-new.jks keystore.properties
          test -s qrscanner-new.jks || { echo "::error::qrscanner-new.jks is missing or empty - check the KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD secret is empty or misnamed"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::KEY_ALIAS secret is empty or misnamed"; exit 1; }
          keytool -list -keystore qrscanner-new.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1 \
            || { echo "::error::keystore cannot be opened with these secrets - KEYSTORE_BASE64 is corrupted, or the password/alias is wrong"; exit 1; }
          echo "Keystore opens fine and alias exists."

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK (clean, from scratch)
        run: ./gradlew releaseApk

      - name: Print SHA256 (for the GitHub Release notes / comparison)
        run: sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
