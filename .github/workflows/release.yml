name: Release Build

# Builds the signed release APK on Linux (ubuntu-latest) whenever a version
# tag (v1.0, v2.2, ...) is pushed. This exists so the APK used as the
# F-Droid "reference" binary is always built the same way, on the same OS
# family F-Droid itself builds on — never from a local Windows machine.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tagged commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > qrscanner-new.jks

      - name: Write keystore.properties
        run: |
          cat > keystore.properties << EOF
          storeFile=qrscanner-new.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK (clean, from scratch)
        run: ./gradlew releaseApk

      - name: Print SHA256 (for the GitHub Release notes / comparison)
        run: sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
